<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List - Bài Tập Đã Hoàn Thành</title>
</head>
<body>

    <h1>To-do List - Danh Sách Việc Đã Làm</h1>

    <ul>
        <!-- Sầm Quang Huy (Chủ nhóm) -->
        <li>
            <strong>Sầm Quang Huy (Chủ nhóm)</strong>
            <ul>
                <li>
                    <input type="checkbox" id="task1_1" checked disabled>
                    <label for="task1_1">Hoàn thành trang giới thiệu cá nhân</label>
                </li>
                <li>
                    <input type="checkbox" id="task1_2" checked disabled>
                    <label for="task1_2">Fork repository mẫu và khởi tạo project chung</label>
                </li>
                <li>
                    <input type="checkbox" id="task1_3" checked disabled>
                    <label for="task1_3">Thêm các thành viên vào Collaborators trên GitHub</label>
                </li>
                <li>
                    <input type="checkbox" id="task1_4" checked disabled>
                    <label for="task1_4">Duyệt Merge Pull Request và xử lý conflict code</label>
                </li>
            </ul>
        </li>

        <br> <!-- Xuống dòng tạo khoảng cách giữa các thành viên -->

        <!-- Nguyễn Thị Chi -->
        <li>
            <strong>Nguyễn Thị Chi</strong>

                </li>
            </ul>
        </li>

        <br>

        <!-- Nguyễn Thị Hồng Nhung -->

            <strong>Nguyễn Thị Hồng Nhung</strong>

                <li>
                    <input type="checkbox" id="task3" checked disabled>
                    <label for="task3">Hoàn thành trang giới thiệu cá nhân</label>
                </li>
            </ul>
        </li>

        <br>

        <!-- Phạm Nhật Hưng -->
        <li>
            <strong>Phạm Nhật Hưng</strong>
            <ul>
                <li>
                    <input type="checkbox" id="task4" checked disabled>
                    <label for="task4">Hoàn thành trang giới thiệu cá nhân</label>
                </li>
            </ul>
        </li>

</body>
